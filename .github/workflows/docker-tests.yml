name: Testes com Docker

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./golden-movie-studio-backend
          push: false
          load: true
          tags: gms-backend:latest

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./golden-movie-studio-frontend
          push: false
          load: true
          tags: gms-frontend:latest

      - name: Build Cypress image
        uses: docker/build-push-action@v5
        with:
          context: ./tests
          push: false
          load: true
          tags: gms-cypress:latest

      - name: Subir containers com docker compose
        run: docker compose up -d backend frontend

      - name: Aguardar os serviços subirem
        run: |
          echo "Aguardando backend ficar pronto..."
          sleep 15
          
          # Verifica se backend está respondendo
          for i in {1..30}; do
            if curl -f http://localhost:3000/health 2>/dev/null || curl -f http://localhost:3000 2>/dev/null; then
              echo "Backend pronto!"
              break
            fi
            echo "Tentativa $i/30... aguardando backend..."
            sleep 2
          done
          
          echo "Aguardando frontend ficar pronto..."
          for i in {1..30}; do
            if curl -f http://localhost:8080 2>/dev/null; then
              echo "Frontend pronto!"
              break
            fi
            echo "Tentativa $i/30... aguardando frontend..."
            sleep 2
          done

      - name: Executar testes
        run: docker compose run --rm cypress

      - name: Salvar evidências de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-reports
          path: |
            cypress-videos/
            cypress-screenshots/
          retention-days: 30

      - name: Parar containers
        if: always()
        run: docker compose down

      - name: Login para Docker Hub (opcional - bônus)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        continue-on-error: true

      - name: Build e push Backend para Docker Hub (bônus)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./golden-movie-studio-backend
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gms-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/gms-backend:${{ github.sha }}
        continue-on-error: true

      - name: Build e push Frontend para Docker Hub (bônus)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./golden-movie-studio-frontend
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gms-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/gms-frontend:${{ github.sha }}
        continue-on-error: true

      - name: Build e push Cypress para Docker Hub (bônus)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./tests
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/gms-cypress:latest
            ${{ secrets.DOCKER_USERNAME }}/gms-cypress:${{ github.sha }}
        continue-on-error: true

      - name: Resultado
        run: echo "✅ Testes executados com sucesso via Docker Compose!"
